info:
  name: List Conversation Messages
  type: http
  seq: 4
  tags:
    - conversations
    - messages
http:
  method: GET
  url: '{{baseUrl}}/conversations/{{conversationId}}/messages?limit=50'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('lists tenant messages without provider ingestion', function () {
          expect(res.status).to.equal(200);
          expect(res.body.items).to.be.an('array');
        });
