info:
  name: Update Workflow Draft
  type: http
  seq: 3
  tags:
    - workflows
http:
  method: PATCH
  url: '{{baseUrl}}/workflows/{{workflowId}}'
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{accessToken}}'
  body:
    type: json
    data: '{"name":"Updated missed call recovery"}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('updates an editable draft', function () {
          expect(res.status).to.equal(200);
          expect(res.body.name).to.equal('Updated missed call recovery');
        });
