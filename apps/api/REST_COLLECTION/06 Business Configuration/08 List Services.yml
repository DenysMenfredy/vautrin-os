info:
  name: List Services
  type: http
  seq: 8
  tags:
    - business
    - services
http:
  method: GET
  url: '{{baseUrl}}/business/services?limit=50&active=true'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns active tenant services', function () {
          expect(res.status).to.equal(200);
          expect(res.body.items).to.be.an('array');
        });
