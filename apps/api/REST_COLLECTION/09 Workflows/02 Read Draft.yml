info:
  name: Read Workflow
  type: http
  seq: 2
  tags:
    - workflows
http:
  method: GET
  url: '{{baseUrl}}/workflows/{{workflowId}}'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns the tenant workflow definition', function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('workflowId'));
        });
