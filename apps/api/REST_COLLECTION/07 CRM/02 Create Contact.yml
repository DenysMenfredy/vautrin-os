info:
  name: Create Contact
  type: http
  seq: 2
  tags:
    - crm
    - contacts
http:
  method: POST
  url: '{{baseUrl}}/contacts'
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{accessToken}}'
  body:
    type: json
    data: |-
      {
        "firstName": "Bruno",
        "lastName": "Smoke Test"
      }
runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) bru.setVar('contactId', res.body.id);
    - type: tests
      code: |-
        test('creates a contact in the active tenant', function () {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.be.a('string');
        });
