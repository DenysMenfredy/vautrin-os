info:
  name: Get Service Area
  type: http
  seq: 15
  tags:
    - business
    - service-areas
http:
  method: GET
  url: '{{baseUrl}}/business/service-areas/{{serviceAreaId}}'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('serviceAreaId')) bru.runner.skipRequest();
    - type: tests
      code: |-
        test('reads the created tenant service area', function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('serviceAreaId'));
        });
