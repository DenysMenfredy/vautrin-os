info:
  name: CRM Dashboard
  type: http
  seq: 8
  tags:
    - crm
    - dashboard
http:
  method: GET
  url: '{{baseUrl}}/crm/dashboard'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns active-tenant pipeline counts', function () {
          expect(res.status).to.equal(200);
          expect(res.body.total).to.be.a('number');
          expect(res.body.byStatus.CONTACTED).to.be.a('number');
        });
