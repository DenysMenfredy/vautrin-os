info:
  name: List Locations
  type: http
  seq: 3
  tags:
    - business
    - locations
http:
  method: GET
  url: '{{baseUrl}}/business/locations?limit=50'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns a paginated tenant location list', function () {
          expect(res.status).to.equal(200);
          expect(res.body.items).to.be.an('array');
          expect(res.body).to.have.property('nextCursor');
        });
