info:
  name: Current Session
  type: http
  seq: 2
  tags:
    - auth
    - smoke
http:
  method: GET
  url: '{{baseUrl}}/auth/me'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns the authenticated user and tenant context', function () {
          expect(res.status).to.equal(200);
          expect(res.body.user.id).to.be.a('string');
          expect(res.body.capabilities).to.be.an('array');
          expect(res.body.memberships).to.be.an('array');
        });
