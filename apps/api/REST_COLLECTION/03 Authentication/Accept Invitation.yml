info:
  name: Register (Accept Invitation)
  type: http
  seq: 1
  tags:
    - auth
    - tenant
http:
  method: POST
  url: '{{baseUrl}}/auth/invitations/accept'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: '{}'
runtime:
  scripts:
    - type: before-request
      code: |-
        // Require an explicitly selected invitation token. Bruno runtime
        // variables may retain a revoked token from an earlier invitation.
        const token = bru.getEnvVar('acceptInvitationToken');
        const password = bru.getEnvVar('invitationPassword') || bru.getEnvVar('password');
        if (!token) {
          throw new Error('Set the current invitation in acceptInvitationToken in the selected Bruno environment.');
        } else {
          if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
            throw new Error('acceptInvitationToken must be the 43-character token returned by the latest invitation.');
          }
          if (!password) {
            throw new Error('Set password or invitationPassword in the selected Bruno environment before accepting an invitation.');
          }
          req.setBody({ token, password });
        }
    - type: tests
      code: |-
        test('activates a one-time invitation', function () {
          expect(res.status).to.equal(204);
        });
