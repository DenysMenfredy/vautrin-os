info:
  name: Get Location
  type: http
  seq: 5
  tags:
    - business
    - locations
http:
  method: GET
  url: '{{baseUrl}}/business/locations/{{locationId}}'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('locationId')) bru.runner.skipRequest();
    - type: tests
      code: |-
        test('reads the created tenant location', function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('locationId'));
        });
