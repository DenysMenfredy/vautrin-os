# ---------------------------------------------------------------------------
# CodeQL — static security analysis (SDD-11 §9 "security checks")
#
# Separate from ci.yml because it has different economics: a full analysis
# takes minutes, and its value is in finding classes of bug that lint cannot
# see — injection, unsafe deserialisation, tainted paths reaching a sink.
#
# The path-traversal in the Nuxt API proxy was exactly that shape: a
# request-controlled value flowing into a proxy target. It was found by hand;
# this is the automation that should catch the next one.
# ---------------------------------------------------------------------------

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    - cron: '17 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required to upload results to the Security tab.
      security-events: write
      # Required for the analyze step to read its own workflow run. Without
      # it the run fails with "Resource not accessible by integration" on
      # GET /repos/{owner}/{repo}/actions/runs/{run_id} — the top-level
      # `permissions: contents: read` does not cover the Actions API.
      actions: read
      # Needed when CodeQL resolves query packs from GitHub Packages.
      packages: read

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript-typescript
          # security-extended adds lower-precision queries that still matter
          # for a multi-tenant platform handling customer data.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4.38.1
        with:
          category: /language:javascript-typescript
