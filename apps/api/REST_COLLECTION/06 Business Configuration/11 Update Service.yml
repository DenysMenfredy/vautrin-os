info:
  name: Update Service
  type: http
  seq: 11
  tags:
    - business
    - services
http:
  method: PATCH
  url: '{{baseUrl}}/business/services/{{serviceId}}'
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{accessToken}}'
  body:
    type: json
    data: |-
      {
        "name": "Bruno Updated Service"
      }
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('serviceId')) bru.runner.skipRequest();
    - type: tests
      code: |-
        test('updates a tenant service', function () {
          expect(res.status).to.equal(200);
          expect(res.body.name).to.equal('Bruno Updated Service');
        });
