info:
  name: Login — invalid credentials
  type: http
  seq: 1
  tags:
    - auth
    - negative
http:
  method: POST
  url: '{{baseUrl}}/auth/login'
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "bruno.invalid@example.invalid",
        "password": "not-a-real-password-for-bruno"
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test('rejects unknown credentials without exposing account existence', function () {
          expect(res.status).to.equal(401);
          expect(res.body.message).to.equal('Invalid email or password.');
        });
