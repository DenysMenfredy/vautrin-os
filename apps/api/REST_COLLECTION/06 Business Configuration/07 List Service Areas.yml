    - service-areas
http:
  method: GET
  url: '{{baseUrl}}/business/service-areas?limit=50&active=true'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns active tenant service areas', function () {
          expect(res.status).to.equal(200);
          expect(res.body.items).to.be.an('array');
        });
