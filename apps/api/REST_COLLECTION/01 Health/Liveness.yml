info:
  name: Liveness
  type: http
  seq: 1
  tags:
    - health
    - smoke
http:
  method: GET
  url: '{{baseUrl}}/health/live'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns a healthy liveness response', function () {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal('ok');
          expect(res.body.uptimeSeconds).to.be.a('number');
        });
