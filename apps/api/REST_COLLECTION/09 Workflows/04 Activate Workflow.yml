info:
  name: Activate Workflow
  type: http
  seq: 4
  tags:
    - workflows
http:
  method: PATCH
  url: '{{baseUrl}}/workflows/{{workflowId}}/status'
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{accessToken}}'
  body:
    type: json
    data: '{"status":"ACTIVE"}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('publishes the immutable workflow version', function () {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal('ACTIVE');
          expect(res.body.publishedAt).to.be.a('string');
        });
