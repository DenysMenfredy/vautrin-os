info:
  name: Update Business Profile
  type: http
  seq: 1
  tags:
    - business
    - configuration
http:
  method: PATCH
  url: '{{baseUrl}}/business/profile'
  headers:
    - name: Content-Type
      value: application/json
  auth:
    type: bearer
    token: '{{accessToken}}'
  body:
    type: json
    data: |-
      {
        "displayName": "Sample Remodeling Co.",
        "timezone": "America/Belem",
        "locale": "en-US",
        "currency": "USD",
        "businessHours": {
          "timezone": "America/Belem",
          "weekly": {
            "monday": { "enabled": true, "periods": [{ "start": "09:00", "end": "17:00" }] },
            "tuesday": { "enabled": true, "periods": [{ "start": "09:00", "end": "17:00" }] },
            "wednesday": { "enabled": true, "periods": [{ "start": "09:00", "end": "17:00" }] },
            "thursday": { "enabled": true, "periods": [{ "start": "09:00", "end": "17:00" }] },
            "friday": { "enabled": true, "periods": [{ "start": "09:00", "end": "17:00" }] },
            "saturday": { "enabled": false, "periods": [] },
            "sunday": { "enabled": false, "periods": [] }
          }
        }
      }
runtime:
  scripts:
    - type: tests
      code: |-
        test('updates the active tenant business profile', function () {
          expect(res.status).to.equal(200);
          expect(res.body.displayName).to.equal('Sample Remodeling Co.');
          expect(res.body.timezone).to.equal('America/Belem');
        });
