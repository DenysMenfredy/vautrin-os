name: vautrin-v03-tests
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vautrin
      POSTGRES_PASSWORD: vautrin_test_only
      POSTGRES_DB: vautrin_test
      VAUTRIN_ROLE_PASSWORD: vautrin_test_only
    ports: ['5545:5432']
    volumes:
      - test-postgres:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vautrin -d vautrin_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  test-postgres:
