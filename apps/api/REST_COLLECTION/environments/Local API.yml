name: Local API
variables:
  - name: baseUrl
    value: http://localhost:3000/api
  - name: tenantId
    value: ""
  - secret: true
    name: email
    description: ""
  - secret: true
    name: password
    description: ""
  - secret: true
    name: invitationToken
    description: One-time invitation token; clear it after acceptance.
  - secret: true
    name: invitationPassword
    description: Optional; defaults to password for invitation acceptance.
