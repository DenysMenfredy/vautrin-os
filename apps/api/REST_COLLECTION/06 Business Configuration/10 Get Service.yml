info:
  name: Get Service
  type: http
  seq: 10
  tags:
    - business
    - services
http:
  method: GET
  url: '{{baseUrl}}/business/services/{{serviceId}}'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('serviceId')) bru.runner.skipRequest();
    - type: tests
      code: |-
        test('reads the created tenant service', function () {
          expect(res.status).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar('serviceId'));
        });
