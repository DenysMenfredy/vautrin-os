info:
  name: Readiness
  type: http
  seq: 2
  tags:
    - health
    - smoke
http:
  method: GET
  url: '{{baseUrl}}/health/ready'
runtime:
  scripts:
    - type: tests
      code: |-
        test('returns a ready database status', function () {
          expect(res.status).to.equal(200);
          expect(res.body.status).to.equal('ok');
          expect(res.body.database.status).to.equal('up');
          expect(res.body.database.latencyMs).to.be.a('number');
        });
