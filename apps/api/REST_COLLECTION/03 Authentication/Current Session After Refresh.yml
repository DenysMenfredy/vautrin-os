info:
  name: Current Session — latest access token
  type: http
  seq: 7
  tags:
    - auth
    - smoke
http:
  method: GET
  url: '{{baseUrl}}/auth/me'
  auth:
    type: bearer
    token: '{{accessToken}}'
runtime:
  scripts:
    - type: tests
      code: |-
        test('accepts the access token issued by refresh', function () {
          expect(res.status).to.equal(200);
          expect(res.body.user.id).to.be.a('string');
        });
